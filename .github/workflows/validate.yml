name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install QA tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.4

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration with Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate repository with HACS
        uses: hacs/action@main
        with:
          category: integration
